[project]
name = "sikk2d-psd-import"
version = "0.1.0"
description = "Deterministic PSD raster layer bundle converter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psd-tools[composite]>=1.23,<2",
    "Pillow>=11,<13",
    "jsonschema>=4.23,<5",
]

[project.scripts]
sikk2d-psd-import = "psd_import.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["psd_import*"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tools/psd_import/tests"]
markers = ["integration: private read-only PSD fixtures (skip when absent)"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
psd_import = ["manifest-v1.schema.json"]
